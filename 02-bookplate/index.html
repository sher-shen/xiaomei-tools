<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>年度读书藏书票</title>
<meta name="description" content="输入年度书单，生成古籍风藏书票与书单小票，纯本地生成，不上传任何数据。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>年度读书藏书票</h1>
  <p class="sub">一年读过的书，刻成一枚藏书印记</p>
</header>

<main class="wrap">
  <section class="panel" aria-label="填写">
    <div class="row2">
      <label class="field">
        <span>年份</span>
        <input id="year" type="number" inputmode="numeric" min="1900" max="2200" value="2026">
      </label>
      <label class="field">
        <span>藏书人</span>
        <input id="owner" type="text" maxlength="12" placeholder="如：小美" autocomplete="off">
      </label>
    </div>

    <label class="field">
      <span>书单 <em>每行一本，格式「书名 / 作者」，作者可省，最多 30 本</em></span>
      <textarea id="list" rows="7" spellcheck="false" placeholder="红楼梦 / 曹雪芹&#10;浮生六记 / 沈复&#10;呐喊"></textarea>
    </label>
    <div class="hint" id="count"></div>

    <div class="field">
      <span>评星与年度之书 <em>点星打分，再点同星取消；圈选一本为年度之书</em></span>
      <div id="books" class="books"><p class="empty">填入书单后，这里会列出每本书。</p></div>
    </div>

    <div class="field">
      <span>样式</span>
      <div class="seg" role="tablist">
        <button type="button" id="tab-plate" class="on" data-tpl="plate">藏书票</button>
        <button type="button" id="tab-receipt" data-tpl="receipt">书单小票</button>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="demo" class="ghost">示例书单</button>
      <button type="button" id="clear" class="ghost">清空</button>
    </div>
  </section>

  <section class="stage" aria-label="预览">
    <div class="canvas-box"><canvas id="cv" width="1242" height="1656"></canvas></div>
    <p class="status" id="status">正在备纸研墨……</p>
    <button type="button" id="save" class="primary">保存图片</button>
  </section>
</main>

<footer class="foot">
  <p>全部在本机浏览器内生成，不上传任何内容。</p>
  <p>题字字体「马善政楷书 Ma Shan Zheng」，依 SIL Open Font License 1.1 授权，<a href="fonts/mashanzheng-OFL.txt">查看授权全文</a>。</p>
</footer>

<div id="overlay" class="overlay" hidden>
  <div class="ov-bar"><span>长按图片保存</span><button type="button" id="ov-close">关闭</button></div>
  <div class="ov-body"><img id="ov-img" alt="生成的图片，长按保存"></div>
</div>

<script src="app.js"></script>
</body>
</html>
